add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Isolates the app window from pages it opens or is opened by. Sign-in and payments use full-page redirects, not popups, so nothing breaks.
add_header Cross-Origin-Opener-Policy "same-origin" always;
# "credentialless" (not "require-corp"): outside files such as Google Fonts, photos and videos still load, but never with the user's cookies.
add_header Cross-Origin-Embedder-Policy "credentialless" always;
add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' ws: wss: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
