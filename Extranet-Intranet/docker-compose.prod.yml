# Production stack. Uses .env.production (copy .env.production.example). See docs/deployment.md.
# Never seeds demo data. Database updates run only through the explicit "migrate" command.
x-backend: &backend
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  image: grupo-global-backend:${APP_VERSION:-latest}
  env_file:
    - ${GG_ENV_FILE:-.env.production}
  environment: &backend-env
    NODE_ENV: production
    PORT: 5000
    DATABASE_URL: postgres://${DB_USER:-grupo_global}:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/${DB_NAME:-grupo_global}
    TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
    BACKUP_METHOD: direct
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - gg_storage:/app/storage
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - internal

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-grupo_global}
      POSTGRES_USER: ${DB_USER:-grupo_global}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
    volumes:
      - gg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  migrate:
    <<: *backend
    profiles: ["ops"]
    restart: "no"
    command: ["npm", "run", "db:migrate"]

  backend:
    <<: *backend
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_TURN_URL: ${VITE_TURN_URL:-}
        VITE_TURN_USERNAME: ${VITE_TURN_USERNAME:-}
        VITE_TURN_CREDENTIAL: ${VITE_TURN_CREDENTIAL:-}
    image: grupo-global-web:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - internal

networks:
  internal:

volumes:
  gg_pgdata:
  gg_storage:
